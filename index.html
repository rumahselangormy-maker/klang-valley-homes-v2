<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klang Valley Homes</title>
    <script>
      window.addEventListener('error', function(event) {
        if (event && event.message && (event.message.includes('Blocked a frame with origin') || event.message.includes('$$typeof'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && event.reason.message && (event.reason.message.includes('Blocked a frame with origin') || event.reason.message.includes('$$typeof'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
